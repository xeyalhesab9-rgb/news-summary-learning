
name: Test Node.js project

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run project
        run: node main.ts

      - name: Check output
        run: |
          test -f output/entry.txt
          cmp summary-1.txt output/entry.txt
